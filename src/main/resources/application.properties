# ─────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────
server.port=8080

# ─────────────────────────────────────────────
# Database (PostgreSQL)
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/airline_db
spring.datasource.username=postgres
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─────────────────────────────────────────────
# JWT
# ─────────────────────────────────────────────
jwt.secret=your-256-bit-secret-key-must-be-at-least-32-chars-long!!
jwt.expiration=86400000

# ─────────────────────────────────────────────
# Swagger
# ─────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─────────────────────────────────────────────
# App
# ─────────────────────────────────────────────
spring.application.name=airline-reservation
logging.level.com.airline=INFO
